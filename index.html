  <style>
    :root {
      --bg: #030305;
      --bg-card: #09090e;
      --bg-card-hover: #101118;
      --border: rgba(255, 255, 255, 0.08);
      --border-hover: rgba(255, 255, 255, 0.22);
      --accent-cyan: #00d2ff;
      --accent-blue: #0066ff;
      --accent-glow: rgba(0, 102, 255, 0.18);
      --text: #f5f5f7;
      --text-muted: #8e8e99;
      --text-dim: #545461;
      --font: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; scroll-behavior: smooth; }

    body {
      background-color: var(--bg);
      color: var(--text);
      font-family: var(--font);
      line-height: 1.6;
      -webkit-font-smoothing: antialiased;
      overflow-x: hidden;
    }

    ::selection { background: #ffffff; color: #000000; }

    header {
      position: fixed; top: 0; left: 0; width: 100%; z-index: 100;
      padding: 20px 0; transition: all 0.3s ease; background: transparent;
    }

    header.scrolled {
      background: rgba(3, 3, 5, 0.88);
      backdrop-filter: blur(20px);
      border-bottom: 1px solid var(--border);
      padding: 14px 0;
    }

    .nav-container {
      max-width: 1200px; margin: 0 auto; padding: 0 32px;
      display: flex; align-items: center; justify-content: space-between;
    }

    .brand {
      font-size: 0.95rem; font-weight: 700; letter-spacing: 0.2em;
      text-transform: uppercase; color: var(--text); text-decoration: none;
      display: flex; align-items: center; gap: 10px;
    }

    .brand-dot { width: 7px; height: 7px; border-radius: 50%; background: var(--accent-cyan); }

    .nav-links { display: flex; gap: 36px; list-style: none; }
    .nav-links a { color: var(--text-muted); text-decoration: none; font-size: 0.86rem; transition: color 0.2s ease; }
    .nav-links a:hover { color: var(--text); }

    .btn {
      font-family: var(--font); font-size: 0.84rem; font-weight: 500;
      padding: 11px 24px; border-radius: 999px; border: 1px solid transparent;
      cursor: pointer; display: inline-flex; align-items: center; gap: 8px;
      transition: all 0.25s ease; text-decoration: none;
    }

    .btn-white { background: #ffffff; color: #000000; }
    .btn-white:hover { background: #e4e4e7; transform: translateY(-1px); }

    .btn-outline { background: transparent; color: var(--text); border-color: var(--border); }
    .btn-outline:hover { border-color: var(--border-hover); background: rgba(255, 255, 255, 0.04); }

    .hero {
      position: relative; min-height: 100vh; display: flex; flex-direction: column;
      align-items: center; justify-content: center; text-align: center;
      padding: 140px 24px 70px;
    }

    .hero-badge { font-size: 0.76rem; font-weight: 600; letter-spacing: 0.16em; text-transform: uppercase; color: var(--accent-cyan); margin-bottom: 20px; }

    .hero-title { font-size: clamp(2.8rem, 6.5vw, 5.2rem); font-weight: 600; letter-spacing: -0.03em; line-height: 1.05; max-width: 900px; margin-bottom: 22px; }

    .hero-subtitle { font-size: 1.1rem; color: var(--text-muted); max-width: 560px; margin: 0 auto 36px; }

    .hero-cta { display: flex; gap: 16px; align-items: center; margin-bottom: 50px; }

    .hero-photo-wrap { position: relative; width: 100%; max-width: 620px; min-height: 380px; display: flex; align-items: center; justify-content: center; }

    .hero-photo-wrap::before {
      content: ''; position: absolute; width: 60%; height: 60%;
      background: radial-gradient(circle, var(--accent-glow) 0%, transparent 70%);
      filter: blur(50px); z-index: 0; pointer-events: none;
    }

    .product-img {
      position: relative; z-index: 1; width: 100%; max-height: 460px;
      object-fit: contain; filter: drop-shadow(0 30px 60px rgba(0, 0, 0, 0.95));
      transition: transform 0.4s ease;
    }

    .product-img:hover { transform: scale(1.02); }

    .section-wrap { padding: 120px 32px; max-width: 1200px; margin: 0 auto; }
    .section-head { margin-bottom: 60px; }
    .section-head.center { text-align: center; max-width: 620px; margin-left: auto; margin-right: auto; }

    .section-kicker { font-size: 0.74rem; font-weight: 600; letter-spacing: 0.18em; text-transform: uppercase; color: var(--text-muted); margin-bottom: 12px; display: block; }

    .section-headline { font-size: clamp(2rem, 3.5vw, 2.8rem); font-weight: 600; letter-spacing: -0.02em; line-height: 1.15; }

    .features-bento { display: grid; grid-template-columns: repeat(12, 1fr); gap: 20px; }

    .bento-cell { background: var(--bg-card); border: 1px solid var(--border); border-radius: 14px; padding: 36px; display: flex; flex-direction: column; justify-content: space-between; overflow: hidden; position: relative; transition: all 0.3s ease; }

    .bento-cell:hover { border-color: var(--border-hover); background: var(--bg-card-hover); }

    .bento-cell.span-7 { grid-column: span 7; }
    .bento-cell.span-5 { grid-column: span 5; }
    .bento-cell.span-4 { grid-column: span 4; }

    .bento-cell-photo { width: 100%; height: 250px; display: flex; align-items: center; justify-content: center; margin-top: 24px; }

    .bento-cell-photo img { max-width: 85%; max-height: 100%; object-fit: contain; filter: drop-shadow(0 15px 30px rgba(0, 0, 0, 0.8)); transition: transform 0.35s ease; }

    .bento-cell:hover .bento-cell-photo img { transform: scale(1.04); }

    .cell-title { font-size: 1.28rem; font-weight: 600; margin-bottom: 10px; letter-spacing: -0.01em; }
    .cell-desc { color: var(--text-muted); font-size: 0.92rem; line-height: 1.6; }

    .tech-row { display: grid; grid-template-columns: 1fr 1fr; align-items: center; gap: 60px; padding: 60px 0; border-top: 1px solid var(--border); }
    .tech-row:last-child { border-bottom: 1px solid var(--border); }

    .tech-row.reverse .tech-copy { order: 2; }
    .tech-row.reverse .tech-visual { order: 1; }

    .tech-number { font-size: 0.8rem; color: var(--text-dim); font-weight: 500; margin-bottom: 12px; display: block; }
    .tech-heading { font-size: 1.85rem; font-weight: 600; margin-bottom: 16px; letter-spacing: -0.02em; }
    .tech-paragraph { color: var(--text-muted); font-size: 0.98rem; line-height: 1.7; }

    .tech-visual { background: var(--bg-card); border: 1px solid var(--border); border-radius: 14px; height: 350px; display: flex; align-items: center; justify-content: center; padding: 32px; overflow: hidden; }

    .tech-visual img { max-width: 85%; max-height: 85%; object-fit: contain; filter: drop-shadow(0 20px 40px rgba(0, 0, 0, 0.85)); }

    .checkout-card { background: var(--bg-card); border: 1px solid var(--border); border-radius: 16px; display: grid; grid-template-columns: 1.15fr 1fr; overflow: hidden; }

    .checkout-gallery { background: #020204; padding: 50px 40px; display: flex; flex-direction: column; align-items: center; justify-content: center; border-right: 1px solid var(--border); }

    .checkout-main-img-box { width: 100%; height: 350px; display: flex; align-items: center; justify-content: center; margin-bottom: 24px; }

    .checkout-main-img-box img { max-width: 90%; max-height: 100%; object-fit: contain; filter: drop-shadow(0 25px 45px rgba(0, 0, 0, 0.95)); transition: opacity 0.25s ease, transform 0.25s ease; }

    .checkout-thumbnails { display: flex; gap: 12px; }

    .thumb-btn { width: 58px; height: 58px; border-radius: 8px; border: 1px solid var(--border); background: var(--bg-card); padding: 6px; cursor: pointer; display: flex; align-items: center; justify-content: center; transition: all 0.2s ease; }

    .thumb-btn.active { border-color: #ffffff; background: #15151f; }
    .thumb-btn img { width: 100%; height: 100%; object-fit: contain; }

    .checkout-info { padding: 60px 48px; display: flex; flex-direction: column; justify-content: center; }

    .checkout-tag { font-size: 0.75rem; font-weight: 600; color: var(--accent-cyan); letter-spacing: 0.14em; text-transform: uppercase; margin-bottom: 12px; }
    .checkout-title { font-size: 2.3rem; font-weight: 600; letter-spacing: -0.02em; margin-bottom: 16px; }
    .checkout-price { font-size: 2.6rem; font-weight: 600; letter-spacing: -0.03em; margin-bottom: 28px; color: #ffffff; }

    .checkout-specs { list-style: none; margin-bottom: 36px; display: flex; flex-direction: column; gap: 12px; }
    .checkout-specs li { display: flex; align-items: center; gap: 12px; color: var(--text-muted); font-size: 0.92rem; }
    .checkout-specs li i { color: #ffffff; width: 16px; height: 16px; }

    .modal-overlay { position: fixed; inset: 0; background: rgba(0, 0, 0, 0.85); backdrop-filter: blur(16px); display: flex; align-items: center; justify-content: center; padding: 24px; z-index: 1000; opacity: 0; pointer-events: none; transition: opacity 0.25s ease; }

    .modal-overlay.active { opacity: 1; pointer-events: all; }

    .modal-dialog { background: #0c0c12; border: 1px solid var(--border-hover); border-radius: 16px; max-width: 440px; width: 100%; padding: 40px 32px; text-align: center; transform: translateY(14px); transition: transform 0.25s ease; box-shadow: 0 40px 80px rgba(0, 0, 0, 0.9); }

    .modal-overlay.active .modal-dialog { transform: translateY(0); }

    .modal-icon-ring { width: 44px; height: 44px; border-radius: 50%; background: rgba(255, 255, 255, 0.05); border: 1px solid var(--border); display: flex; align-items: center; justify-content: center; margin: 0 auto 20px; color: #ffffff; }

    .modal-title { font-size: 1.35rem; font-weight: 600; letter-spacing: -0.01em; margin-bottom: 12px; }
    .modal-message { font-size: 0.92rem; color: var(--text-muted); line-height: 1.6; margin-bottom: 28px; }
    .modal-btn-confirm { width: 100%; padding: 13px; font-size: 0.88rem; }

    footer { border-top: 1px solid var(--border); padding: 60px 32px 40px; background: var(--bg); }
    .footer-inner { max-width: 1200px; margin: 0 auto; display: flex; flex-direction: column; align-items: center; gap: 16px; text-align: center; }
    .footer-notice { font-size: 0.82rem; color: var(--text-dim); }

    @media (max-width: 960px) {
      .bento-cell.span-7, .bento-cell.span-5, .bento-cell.span-4 { grid-column: span 12; }
      .tech-row, .tech-row.reverse { grid-template-columns: 1fr; gap: 36px; }
      .tech-row.reverse .tech-copy { order: 1; }
      .tech-row.reverse .tech-visual { order: 2; }
      .checkout-card { grid-template-columns: 1fr; }
      .checkout-gallery { border-right: none; border-bottom: 1px solid var(--border); padding: 36px 20px; }
      .checkout-info { padding: 36px 24px; }
      .nav-links { display: none; }
    }
  </style>
</head>
